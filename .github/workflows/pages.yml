name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar numpy, matplotlib e networkx
        run: pip install numpy matplotlib networkx

      - name: Testes
        run: |
          node tests/redes-core.test.js
          MPLBACKEND=Agg python3 tests/run_python_cells.py
          python3 tests/check_site.py
          python3 tests/registro_links.py --conferir

      - uses: actions/configure-pages@v5

      # um nome por tentativa: assim "Re-run jobs" não deixa dois pacotes com o mesmo nome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
